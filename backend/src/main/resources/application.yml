server:
  port: 8080

spring:
  application:
    name: arandu-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

arandu:
  jwt:
    secret: ${JWT_SECRET:arandu-ihc-2026-fpuna-secret-key-change-in-production-32bytes}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.springframework.security: WARN
    org.flywaydb: INFO
