server:
  port: 8080

spring:
  application:
    name: arandu-backend
  datasource:
    url: jdbc:h2:file:./data/arandu;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

arandu:
  jwt:
    secret: arandu-ihc-2026-fpuna-secret-key-change-in-production-32bytes
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: WARN
